name: update-opencode-plugin

# Reusable workflow: check ONE opencode plugin's pinned version across one or
# more opencode config files against the latest GitHub release of its upstream
# repo, and open a single PR bumping every file that references it when they
# differ. Parameterized so it can be reused for any plugin added to opencode
# later — the caller (opencode-plugin-updates.yml) drives it once per plugin via
# a matrix.
#
# The version bump is a literal, formatting-preserving text substitution
# (Perl \Q..\E) on the version token, not a jq rewrite: it preserves each
# config's exact formatting (tabs, key order, spacing) and keeps the diff
# minimal. A jq pass would reserialize and reformat the whole file. The match is
# anchored on the leading quote + "<plugin>@<version>" and leaves any export
# subpath after the version (e.g. "<plugin>@<version>/tui" in tui.json) intact.

on:
  workflow_call:
    inputs:
      plugin:
        description: >-
          Plugin package name exactly as it appears in the opencode config
          "plugin" array, WITHOUT the @version suffix
          (e.g. "oh-my-openagent" or "@ex-machina/opencode-anthropic-auth").
        required: true
        type: string
      repository:
        description: >-
          GitHub "owner/repo" whose latest release is the source of truth for
          this plugin's version (e.g. "code-yeongyu/oh-my-openagent").
        required: true
        type: string
      tag-prefix:
        description: >-
          Prefix stripped from the release tag to derive the bare version.
          Both current upstreams tag as "vX.Y.Z" while the config pins "X.Y.Z".
        required: false
        default: "v"
        type: string
      config-paths:
        description: >-
          Newline-separated list of repo-relative opencode config files to
          update for this plugin. Every listed file that references the plugin
          is bumped in one PR; files that don't reference it are skipped. The
          current version is read from the first listed file that contains the
          plugin. An optional export subpath after the version
          ("<plugin>@<version>/tui") is preserved.
        required: false
        default: "home/.config/opencode/opencode.json"
        type: string

# Needs write to push the branch and open/close PRs. The caller must grant at
# least these; a reusable workflow cannot escalate beyond the caller's grant.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: ${{ inputs.plugin }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve current vs latest version
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          REPO: ${{ inputs.repository }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CONFIGS: ${{ inputs.config-paths }}
        run: |
          set -euo pipefail

          # Latest published release tag from upstream, prefix stripped.
          tag="$(gh release view --repo "$REPO" --json tagName --jq '.tagName')"
          latest="${tag#"$TAG_PREFIX"}"

          # Escape the package name for the grep regex (it may contain '.', etc.;
          # '/' is not special in ERE so it is left alone to avoid grep's "stray \
          # before /" warning).
          esc="$(printf '%s' "$PLUGIN" | sed -E 's/[][\.^$*+?(){}|]/\\&/g')"

          # Read the currently pinned version from the FIRST listed config that
          # references the plugin. The token is `"<plugin>@<version>"`, optionally
          # carrying an export subpath (`"<plugin>@<version>/tui"`); strip the
          # subpath to get the bare version.
          current=""
          found_in=""
          while IFS= read -r cfg; do
            [ -n "$cfg" ] || continue
            entry="$(grep -oE "\"${esc}@[^\"]+\"" "$cfg" | head -n1 || true)"
            [ -n "$entry" ] || continue
            tmp="${entry#"\"${PLUGIN}@"}"
            ver="${tmp%\"}"
            current="${ver%%/*}"
            found_in="$cfg"
            break
          done <<EOF
          $CONFIGS
          EOF

          if [ -z "$found_in" ]; then
            echo "::error::Plugin '$PLUGIN' not found in any of: $CONFIGS"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "current=$current"
            echo "latest=$latest"
          } >>"$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "✓ $PLUGIN is up to date ($current)"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "↑ $PLUGIN: $current → $latest (from $found_in)"
          fi

      - name: Bump version and open PR
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PLUGIN: ${{ inputs.plugin }}
          REPO: ${{ inputs.repository }}
          CONFIGS: ${{ inputs.config-paths }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
          RELEASE_TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail

          # Branch carries the target version, so each distinct bump gets its own
          # branch + PR and we never force-push a shared branch.
          slug="$(printf '%s' "$PLUGIN" | sed -E 's#^@##; s#[/@]+#-#g')"
          branch="automation/opencode-plugin/${slug}/${LATEST}"

          # Idempotent: if this exact-version branch already exists on the remote,
          # a previous run already opened the PR — nothing to do.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists; PR already open. Skipping."
            exit 0
          fi

          esc="$(printf '%s' "$PLUGIN" | sed -E 's/[][\.^$*+?(){}|]/\\&/g')"

          # Bump every listed config that references the plugin (skip those that
          # don't). The literal, formatting-preserving substitution (\Q..\E quotes
          # every metacharacter; env vars avoid @ARGV confusion) is anchored on
          # the leading quote + "<plugin>@<version>" and OMITS the trailing quote,
          # so an export subpath after the version ("/tui" in tui.json) survives.
          changed_files=()
          while IFS= read -r cfg; do
            [ -n "$cfg" ] || continue
            entry="$(grep -oE "\"${esc}@[^\"]+\"" "$cfg" | head -n1 || true)"
            [ -n "$entry" ] || continue
            tmp="${entry#"\"${PLUGIN}@"}"
            ver="${tmp%\"}"
            file_current="${ver%%/*}"
            if [ "$file_current" = "$LATEST" ]; then
              continue
            fi
            OLD="\"${PLUGIN}@${file_current}" NEW="\"${PLUGIN}@${LATEST}" \
              perl -i -pe 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' "$cfg"
            if ! git diff --quiet -- "$cfg"; then
              changed_files+=("$cfg")
              echo "↑ $cfg: $PLUGIN $file_current → $LATEST"
            fi
          done <<EOF
          $CONFIGS
          EOF

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "::error::Version bump produced no change in any of: $CONFIGS; aborting."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -- "${changed_files[@]}"
          git commit -m "chore(opencode): bump ${PLUGIN} to ${LATEST}"
          git push -u origin "$branch"

          # Markdown bullet list of the bumped files for the PR body. Backticks
          # are escaped in a double-quoted format (literal, not a substitution).
          files_md="$(printf -- "- \`%s\`\n" "${changed_files[@]}")"

          body="$(cat <<EOF
          Automated update of \`${PLUGIN}\` to \`${LATEST}\` in:

          ${files_md}
          | | Version |
          |---|---|
          | Current | \`${CURRENT}\` |
          | Latest | \`${LATEST}\` |

          Source: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}

          Opened by the \`opencode-plugin-updates\` automation.
          EOF
          )"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(opencode): bump ${PLUGIN} to ${LATEST}" \
            --body "$body" \
            --assignee "$OWNER"

          # Close any superseded automation PRs for the same plugin (older target
          # versions), so only the newest bump stays open.
          gh pr list --state open --json number,headRefName \
            --jq ".[]
                  | select(.headRefName | startswith(\"automation/opencode-plugin/${slug}/\"))
                  | select(.headRefName != \"${branch}\")
                  | .number" \
          | while read -r num; do
              [ -n "$num" ] || continue
              gh pr comment "$num" --body "Superseded by the bump to \`${LATEST}\`. Closing."
              gh pr close "$num" --delete-branch
            done
