# Windows-only dotbot tasks - loaded by install.ps1.
#
# Symlinks on Windows require Developer Mode enabled OR running PowerShell
# as Administrator. Without one of those, dotbot's `link:` will fail.
#
# Avoid `if:` directives here - they run via $SHELL which is unreliable on
# Windows. Use this file directly for Windows-only links.
#
# Cross-platform links (git, ssh, docker, mise, opencode, .agents) live in
# install.conf.yaml and apply here too. This file ONLY adds Windows-specific
# paths that differ from the Linux/macOS layout.

- defaults:
    link:
      create: true
      relink: true
      # Repo-managed dotfiles are authoritative; replace real target files.
      force: true

- link:
    # VS Code on Windows - source is the same, target path differs.
    # Only the two tracked *.json files (VS Code writes lots of User/ state).
    ~/AppData/Roaming/Code/User/:
      glob: true
      path: home/.config/Code/User/*.json
      
    # VSCodium on Windows - source is the same, target path differs.
    # Only the two tracked *.json files (VSCodium writes lots of User/ state).
    ~/AppData/Roaming/VSCodium/User/:
      glob: true
      path: home/.config/VSCodium/User/*.json

    # Per-OS git overrides (referenced via [include] in home/.config/git/config)
    ~/.gitconfig.d/windows.gitconfig: home/.gitconfig.d/windows.gitconfig

    # opencode mise wrapper (Windows side; POSIX ships opencode, see
    # install.linux.yaml / install.macos.yaml). PowerShell resolves `opencode`
    # as a bare command once %USERPROFILE%\.local\bin is on PATH - that
    # PATH entry is the user's responsibility.
    ~/.local/bin/opencode.ps1: home/.local/bin/opencode.ps1

    # code -> codium shim (Windows side; POSIX ships code, see
    # install.linux.yaml / install.macos.yaml). Runs VS Codium when `code` is
    # invoked. PowerShell resolves `code` as a bare command once
    # %USERPROFILE%\.local\bin is on PATH.
    ~/.local/bin/code.ps1: home/.local/bin/code.ps1

# Configure glab with PowerShell counterpart of setup-glab.sh.
# `-NoProfile` skips the user's PS profile (avoids unrelated errors blocking
# bootstrap); `-ExecutionPolicy Bypass` lets the unsigned script run without
# requiring a system policy change. Forward slashes in -File are fine -
# PowerShell parses the path itself.
- shell:
    - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/auth/setup-glab.ps1
      description: Set up glab cli
      stdin: true
      stdout: true
      stderr: true

# Re-patch the CLI-managed glab skill after `glab skills install` (the
# install.conf.yaml step) rewrites it from upstream. Upstream writes scratch
# files under the shared /tmp, which this repo denies (agents/SHARED_AGENTS.md
# "Temporary / scratch files" + the opencode.json permission blocks); the patch
# rewrites every /tmp/<file> path to the per-user temp dir. Idempotent: a no-op
# once patched. See scripts/bootstrap/patch-glab-skill.ps1.
- shell:
    - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap/patch-glab-skill.ps1
      description: Patch glab skill /tmp scratch paths to per-user temp dir (after glab skills install)
      stdin: true
      stdout: true
      stderr: true

# Remove ~/.gitconfig so the managed XDG config (~/.config/git/config) stays
# authoritative. `gh auth login` / `glab auth login` run `git config --global`,
# whose write target is ~/.gitconfig; git reads it AFTER the XDG file, so those
# gh/glab credential-helper entries would shadow the ones already defined in
# home/.config/git/config. dotbot runs this shell step under cmd.exe (where `rm`
# and `$HOME` do not exist), so the removal goes through pwsh, which expands
# $HOME itself and accepts the forward-slash path. -ErrorAction SilentlyContinue
# suppresses the "file not found" error, but pwsh still maps the resulting
# $?=$false to exit code 1 and would fail the dotbot step on the (common) absent
# case, so the trailing `; exit 0` forces a clean exit either way. The managed
# config does NOT [include] ~/.gitconfig (only ~/.gitconfig.d/*), so deleting
# the file is safe.
- shell:
    - command: 'pwsh -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue $HOME/.gitconfig; exit 0"'
      description: Remove ~/.gitconfig (gh/glab credential-helper cleanup; XDG config is authoritative)
      stdin: true
      stdout: true
      stderr: true

# Render tracked *.1password templates into ~/.secrets. The helper no-ops when
# no templates exist; when templates are present it requires an authenticated
# `op` CLI session.
- shell:
    - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap/inject-1password-secrets.ps1
      description: Inject 1Password templates into ~/.secrets
      stdin: true
      stdout: true
      stderr: true

# Install desktop fonts to %LOCALAPPDATA%\Microsoft\Windows\Fonts (no admin;
# Win10 1803+). Idempotent: skips fonts already present via marker check.
# Pass `-Force` to reinstall.
- shell:
    - command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap/install-fonts.ps1
      description: Install desktop fonts user-wide (Pretendard, JetBrains Mono, D2Coding, Nerd Font variants)
      stdin: true
      stdout: true
      stderr: true
